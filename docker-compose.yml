# Local/production-shaped stack:  docker compose up -d --build
#
# Copy .env.example to .env first and fill in the secrets, otherwise the API
# container exits immediately with an explanation (this is intentional).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-school_management}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API waits for this, so it never races an uninitialized database.
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-school_management}']
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published by default; reach it with `docker compose exec db psql`.
    expose:
      - '5432'

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4001'
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      DB_HOST: db
      DB_PORT: '5432'
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-school_management}
      DB_SSL: 'false'
      DB_MIGRATIONS_RUN: 'true'
      DB_LOGGING: 'false'
    ports:
      - '${API_PORT:-4001}:4001'

volumes:
  pgdata: